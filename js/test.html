<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>slugify-multilang playground</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #f0f5f1;
        --muted: #a5b6aa;
        --canvas: #10251f;
        --panel: #17342b;
        --field: #0d201a;
        --line: #426557;
        --accent: #d8ff62;
        --accent-ink: #142015;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px 18px;
        color: var(--ink);
        background:
          radial-gradient(circle at 8% 5%, #295b47 0, transparent 28rem),
          radial-gradient(circle at 92% 92%, #204536 0, transparent 25rem),
          var(--canvas);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      main { width: min(820px, 100%); }

      .eyebrow {
        margin: 0 0 13px;
        color: var(--accent);
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.13em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 17ch;
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2.8rem, 8vw, 5.6rem);
        font-weight: 400;
        letter-spacing: -0.06em;
        line-height: 0.9;
      }

      .intro { max-width: 58ch; margin: 24px 0 35px; color: var(--muted); line-height: 1.65; }

      .playground {
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: color-mix(in srgb, var(--panel) 92%, black);
        box-shadow: 0 24px 70px rgb(0 0 0 / 28%);
      }

      .bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 14px 18px;
        border-bottom: 1px solid var(--line);
        color: var(--muted);
        font-size: 0.76rem;
      }

      .status { color: var(--accent); }
      .content { padding: clamp(18px, 4vw, 32px); }
      label { display: block; margin-bottom: 9px; font-size: 0.76rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }

      textarea, input, select, button {
        color: inherit;
        font: inherit;
      }

      textarea, input, select {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 9px;
        outline: none;
        background: var(--field);
        padding: 13px;
      }

      textarea { min-height: 112px; resize: vertical; line-height: 1.5; }
      textarea:focus, input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgb(216 255 98 / 14%); }

      .result {
        position: relative;
        min-height: 72px;
        margin-top: 27px;
        border: 1px solid #7a9e32;
        border-radius: 10px;
        background: #1b311c;
        padding: 18px 64px 18px 18px;
        color: var(--accent);
        font-size: clamp(1rem, 2.5vw, 1.25rem);
        line-height: 1.45;
        overflow-wrap: anywhere;
      }

      .result.empty { color: #87a091; }
      .copy {
        position: absolute;
        top: 10px;
        right: 10px;
        width: auto;
        border: 0;
        border-radius: 7px;
        background: var(--accent);
        color: var(--accent-ink);
        cursor: pointer;
        padding: 8px 10px;
        font-size: 0.75rem;
        font-weight: 800;
      }

      .options {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 15px;
        margin-top: 22px;
      }

      .toggles { display: flex; flex-wrap: wrap; gap: 9px 18px; margin-top: 19px; }
      .toggle { display: flex; align-items: center; gap: 8px; color: var(--muted); cursor: pointer; font-size: 0.84rem; }
      .toggle input { width: auto; accent-color: var(--accent); }

      .samples { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 22px; }
      .sample { width: auto; border: 1px solid var(--line); border-radius: 99px; background: transparent; color: var(--muted); cursor: pointer; padding: 8px 10px; font-size: 0.75rem; }
      .sample:hover, .copy:hover { filter: brightness(1.08); transform: translateY(-1px); }

      @media (max-width: 540px) { .options { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Local package playground</p>
      <h1>Make every URL speak its language.</h1>
      <p class="intro">Type any text below. The result is generated by the local <code>slugify-multilang</code> build, using the same Unicode maps and locale rules published to npm.</p>

      <section class="playground" aria-label="Slugify tester">
        <div class="bar"><span>slugify(input, options)</span><span id="status" class="status">ready</span></div>
        <div class="content">
          <label for="input">Input text</label>
          <textarea id="input" placeholder="Try: Café au lait & cròissant">傅总：你的马甲 又又又掉了！</textarea>

          <div class="result" id="result" aria-live="polite">
            <button class="copy" id="copy" type="button">Copy</button>
            <span id="output"></span>
          </div>

          <div class="options">
            <div><label for="locale">Locale</label><select id="locale"><option value="">Default</option><option>bg</option><option>de</option><option>es</option><option>fr</option><option>pt</option><option>uk</option><option>vi</option><option>da</option><option>nb</option><option>it</option><option>nl</option><option>sv</option></select></div>
            <div><label for="replacement">Replacement</label><input id="replacement" value="-" maxlength="10" /></div>
          </div>

          <div class="toggles">
            <label class="toggle"><input id="lower" type="checkbox" checked /> Lower</label>
            <label class="toggle"><input id="strict" type="checkbox" checked /> Strict</label>
            <label class="toggle"><input id="trim" type="checkbox" checked /> Trim</label>
          </div>

          <div class="samples" aria-label="Sample inputs">
            <button class="sample" type="button" data-value="Café au lait & cròissant">Latin</button>
            <button class="sample" type="button" data-value="Müller & Söhne" data-locale="de">German</button>
            <button class="sample" type="button" data-value="Директор Фу">Cyrillic</button>
            <button class="sample" type="button" data-value="المدير فو">Arabic</button>
            <button class="sample" type="button" data-value="傅总：你的马甲 又又又掉了！">CJK</button>
          </div>
        </div>
      </section>
    </main>

    <script type="module">
      import { slugify } from "./dist/index.js";

      const input = document.querySelector("#input");
      const locale = document.querySelector("#locale");
      const replacement = document.querySelector("#replacement");
      const lower = document.querySelector("#lower");
      const strict = document.querySelector("#strict");
      const trim = document.querySelector("#trim");
      const output = document.querySelector("#output");
      const result = document.querySelector("#result");
      const status = document.querySelector("#status");

      function update() {
        try {
          const value = slugify(input.value, {
            Locale: locale.value || null,
            Replacement: replacement.value,
            Lower: lower.checked,
            Strict: strict.checked,
            Trim: trim.checked,
          });
          output.textContent = value || "(empty slug)";
          result.classList.toggle("empty", !value);
          status.textContent = "updated";
        } catch (error) {
          output.textContent = error.message;
          result.classList.add("empty");
          status.textContent = "error";
        }
      }

      document.querySelectorAll("textarea, input, select").forEach((element) => element.addEventListener("input", update));
      document.querySelectorAll(".sample").forEach((button) => button.addEventListener("click", () => {
        input.value = button.dataset.value;
        locale.value = button.dataset.locale || "";
        update();
      }));
      document.querySelector("#copy").addEventListener("click", async () => {
        await navigator.clipboard.writeText(output.textContent === "(empty slug)" ? "" : output.textContent);
        status.textContent = "copied";
      });
      update();
    </script>
  </body>
</html>
